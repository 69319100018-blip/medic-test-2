name: CI
on:
  push:
    branches: [main, "enterprise/**"]
  pull_request:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # One-time repair: the committed lockfile was incomplete and included
      # a registry mirror that no longer resolves. Rebuild from npmjs.org.
      - name: Generate clean npm lockfile
        run: |
          rm -f package-lock.json
          npm config set registry https://registry.npmjs.org/
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source and API smoke tests
        run: npm run verify
      - name: Commit repaired lockfile
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: repair npm dependency lockfile"
          git push origin "${GITHUB_REF_NAME}"
      - name: Publish generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
