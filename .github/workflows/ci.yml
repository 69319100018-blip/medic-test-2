name: CI
on:
  push:
    branches: [main, "enterprise/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The original lockfile was incomplete and referenced an unavailable mirror.
      # Build a clean lockfile against the official npm registry before npm ci.
      - name: Generate clean npm lockfile
        run: |
          rm -f package-lock.json
          npm config set registry https://registry.npmjs.org/
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source and API smoke tests
        run: npm run verify
      - name: Publish generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
